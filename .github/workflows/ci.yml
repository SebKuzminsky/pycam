name: Run tests
on: [push, pull_request]
jobs:
  Run-tests:
    runs-on: ubuntu-20.04
    container: debian:bullseye
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Install build dependencies
      - run: apt-get update
      - run: apt-get -V --yes --no-install-recommends --no-install-suggests install dpkg-dev devscripts equivs

      - run: dpkg-checkbuilddeps || true
      - run: mk-build-deps -i -r -t 'apt-get -V --yes --no-install-recommends --no-install-suggests'
      - run: rm camelot-build-deps_*

      - run: camelot/run_gui.py --help
      - run: camelot/run_gui.py --version
      - run: camelot/run_cli.py --help
      - run: camelot/run_cli.py --version

      - run: dpkg-buildpackage -us -uc

      - run: apt-get -V --yes install ../camelot_*.deb

      - run: cd .. ; camelot --help
      - run: cd .. ; camelot --version
      - run: cd .. ; camelot-cli --help
      - run: cd .. ; camelot-cli --version

      - run: ls -al
      - run: ls -al ../
